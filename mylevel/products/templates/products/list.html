<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>لیست محصولات</title>
</head>
<form method="GET" action="{% url 'product_search' %}">
    <input type="text" name="q" placeholder="جستجو کنید...">
    <button type="submit">جستجو</button>
</form>
<br>
<body>

    <h1>لیست محصولات</h1>

    <a href="{% url 'product_create' %}">افزودن محصول جدید</a>
    <hr>

    {% for product in products %}
        <h3>{{ product.title }}</h3>
        <p>{{ product.description }}</p>
        <p>قیمت: {{ product.price }}</p>

        {% if product.image %}
            <img src="{{ product.image.url }}" width="150">
        {% endif %}

        <br><br>
        <a href="{% url 'product_detail' product.pk %}">مشاهده</a> |
        <a href="{% url 'product_update' product.pk %}">ویرایش</a> |
        <a href="{% url 'product_delete' product.pk %}">حذف</a>
        <hr>
    {% endfor %}

</body>
</html>
