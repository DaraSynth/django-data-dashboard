{% extends "products/base.html" %}

{% block title %}حذف {{ product.title }}{% endblock %}

{% block content %}
  <h2>آیا از حذف "{{ product.title }}" مطمئنی؟</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit">بله، حذف کن</button>
    <a href="{% url 'product_detail' product.pk %}" style="margin-right:12px;">لغو</a>
  </form>
{% endblock %}
